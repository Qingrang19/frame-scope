[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "frame-scope"
version = "0.1.0"
description = "Offline measurement log replay and integrity checks"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
frame-scope = "frame_scope.__main__:main"

[tool.setuptools.packages.find]
include = ["frame_scope*"]
